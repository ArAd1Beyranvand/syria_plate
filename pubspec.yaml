name: syria_plate
description: "Syria's current licence plates for the plate_core library — the transitional government's plate and the AANES trilingual, bilingual and motorcycle plates, their colour themes and an advisory validator."
version: 0.1.0
homepage: https://github.com/ArAd1Beyranvand/plate-syria
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.5
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
